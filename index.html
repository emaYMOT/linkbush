<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06121d" />
    <meta name="description" content="Páginas de enlaces, carta y catálogo para negocios." />
    <title>Link Bush</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Enlaces viejos con # (linkbush.pages.dev/#/oh-food): pasan a la dirección sin # antes de arrancar la app.
      if (location.hash.indexOf('#/') === 0) history.replaceState(null, '', location.hash.slice(1) || '/')
      // Antes de pintar: modo claro u oscuro del panel, y fondo correcto si se abre directo en /admin.
      try {
        var modo = localStorage.getItem('panel-modo')
        if (modo === 'oscuro' || (modo !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('oscuro')
      } catch (e) {}
      if (location.pathname === '/admin' || location.pathname.indexOf('/admin/') === 0) document.documentElement.dataset.ruta = 'admin'
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Letras del panel. Las de cada página se cargan al abrirla (src/lib/tema.ts). -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
